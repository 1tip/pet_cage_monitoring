# HomeAssistant.yaml
# mqtt.yaml


mqtt:
  # 1. 온도 센서
  sensor:
    - name: "Lizard Cage2 Temperature"
      state_topic: "cage2/temp"
      unit_of_measurement: "°C"
      device_class: temperature
      unique_id: "lizard_cage2_temp_01"
      # [추가] 기기 그룹화 정보
      device: &cage2_device_info
        identifiers: ["cage2_esp32_monitor"]  # 이 ID가 같으면 한 기기로 묶임
        name: "Lizard Cage 2"
        model: "ESP32 Smart Monitor"
        manufacturer: "Custom DIY"

    # 2. 습도 센서
    - name: "Lizard Cage2 Humidity"
      state_topic: "cage2/humi"
      unit_of_measurement: "%"
      device_class: humidity
      unique_id: "lizard_cage2_humi_01"
      # [추가] 위와 동일한 기기 정보 사용
      device: *cage2_device_info

  # 3. 장치 작동 상태
  binary_sensor:
    - name: "Lizard Cage2 Humidifier State"
      state_topic: "cage2/humidifier"
      payload_on: "1"
      payload_off: "0"
      device_class: moisture
      unique_id: "lizard_cage2_humi_state"
      # [추가] 기기 정보 연결
      device: *cage2_device_info

    - name: "Lizard Cage2 Heater State"
      state_topic: "cage2/heater"
      payload_on: "1"
      payload_off: "0"
      device_class: heat
      unique_id: "lizard_cage2_heater_state"
      # [추가] 기기 정보 연결
      device: *cage2_device_info

    - name: "Lizard Cage2 Fan State"
      state_topic: "cage2/fan"
      payload_on: "1"
      payload_off: "0"
      device_class: running
      icon: mdi:fan
      unique_id: "lizard_cage2_fan_state"
      # [추가] 기기 정보 연결
      device: *cage2_device_info
