# HomeAssistant.yaml
# mqtt.yaml
# device_class를 맥락에 맞게 수정 (On/Off (켜짐/꺼짐)로 표시)



mqtt:
  # ==========================================================
  # 1. 아날로그 센서 (온도, 습도)
  # ==========================================================
  sensor:
    # --- [Group 1] 운용 중인 Cage (Topic: cage/...) ---
    - name: "Temperature"
      state_topic: "cage/temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: "cage_temp_main"       # [변경] lizard 제거
      device:
        identifiers: ["cage_monitor"]
        name: "Cage (Main)"             # [변경] 기기 이름 변경
        model: "ESP32 Monitor v1"
        manufacturer: "Custom DIY"

    - name: "Humidity"
      state_topic: "cage/humi"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      unique_id: "cage_humi_main"       # [변경]
      device:
        identifiers: ["cage_monitor"]
        name: "Cage (Main)"
        model: "ESP32 Monitor v1"
        manufacturer: "Custom DIY"

    # --- [Group 2] 테스트용 Cage2 (Topic: cage2/...) ---
    - name: "Temperature"
      state_topic: "cage2/temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      unique_id: "cage2_temp_test"      # [변경]
      device:
        identifiers: ["cage2_monitor"]
        name: "Cage 2 (Test)"           # [변경]
        model: "ESP32 Monitor v2"
        manufacturer: "Custom DIY"

    - name: "Humidity"
      state_topic: "cage2/humi"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      unique_id: "cage2_humi_test"      # [변경]
      device:
        identifiers: ["cage2_monitor"]
        name: "Cage 2 (Test)"
        model: "ESP32 Monitor v2"
        manufacturer: "Custom DIY"


  # ==========================================================
  # 2. 디지털 센서 (작동 상태: 가습기, 히터, 팬)
  # ==========================================================
  binary_sensor:
    # --- [Group 1] 운용 중인 Cage ---
    
    # 1. 가습기
    - name: "Humidifier"
      state_topic: "cage/humidifier"
      payload_on: "1"
      payload_off: "0"
      # device_class 삭제됨 (On/Off 표시)
      icon: mdi:air-humidifier
      unique_id: "cage_humi_state_main"   # [변경]
      device:
        identifiers: ["cage_monitor"]
        name: "Cage (Main)"
        model: "ESP32 Monitor v1"
        manufacturer: "Custom DIY"

    # 2. 히터
    - name: "Heater"
      state_topic: "cage/heater"
      payload_on: "1"
      payload_off: "0"
      icon: mdi:radiator
      unique_id: "cage_heater_state_main" # [변경]
      device:
        identifiers: ["cage_monitor"]
        name: "Cage (Main)"
        model: "ESP32 Monitor v1"
        manufacturer: "Custom DIY"

    # 3. 팬
    - name: "Fan"
      state_topic: "cage/fan"
      payload_on: "1"
      payload_off: "0"
      icon: mdi:fan
      unique_id: "cage_fan_state_main"    # [변경]
      device:
        identifiers: ["cage_monitor"]
        name: "Cage (Main)"
        model: "ESP32 Monitor v1"
        manufacturer: "Custom DIY"


    # --- [Group 2] 테스트용 Cage2 ---
    
    # 1. 가습기 (Cage2)
    - name: "Humidifier"
      state_topic: "cage2/humidifier"
      payload_on: "1"
      payload_off: "0"
      icon: mdi:air-humidifier
      unique_id: "cage2_humi_state_test"  # [변경]
      device:
        identifiers: ["cage2_monitor"]
        name: "Cage 2 (Test)"
        model: "ESP32 Monitor v2"
        manufacturer: "Custom DIY"

    # 2. 히터 (Cage2)
    - name: "Heater"
      state_topic: "cage2/heater"
      payload_on: "1"
      payload_off: "0"
      icon: mdi:radiator
      unique_id: "cage2_heater_state_test" # [변경]
      device:
        identifiers: ["cage2_monitor"]
        name: "Cage 2 (Test)"
        model: "ESP32 Monitor v2"
        manufacturer: "Custom DIY"

    # 3. 팬 (Cage2)
    - name: "Fan"
      state_topic: "cage2/fan"
      payload_on: "1"
      payload_off: "0"
      icon: mdi:fan
      unique_id: "cage2_fan_state_test"    # [변경]
      device:
        identifiers: ["cage2_monitor"]
        name: "Cage 2 (Test)"
        model: "ESP32 Monitor v2"
        manufacturer: "Custom DIY"
        
